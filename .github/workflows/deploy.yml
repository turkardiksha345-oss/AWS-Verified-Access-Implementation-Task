name: Deploy yaml
 
on:
  workflow_run:
    workflows: [ Secure Access Portal CI/CD ]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, pre-prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# Configure these values in GitHub under Settings > Secrets and variables > Actions.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  TF_VERSION: ${{ vars.TF_VERSION || '1.14.2' }}
  TERRAFORM_DIR: terraform
  APP_DIR: application
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME || 'secure-access-portal-preprod-app' }}
  APP_URL: ${{ vars.APP_URL || 'https://app.cdec-engineer.store' }}


jobs:
  deploy:
    name: Build, push, plan, apply, and verify
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug workflow
        run: |
            echo "Repository = ${{ github.repository }}"
            echo "Workflow = ${{ github.workflow }}"
            echo "Event = ${{ github.event_name }}"
            echo "Head Repository = ${{ github.event.workflow_run.head_repository.full_name }}"
            echo "Head Branch = ${{ github.event.workflow_run.head_branch }}"

      - name: Check OIDC variables
        run: |
           echo "ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
           echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN exists:"
           if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
           echo "YES"
           else
           echo "NO"
           fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" ${{ env.APP_DIR }}/
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init and plan
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform init -backend-config=environments/dev/backend.hcl -input=false
          terraform plan -out=tfplan

      - name: Terraform apply
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform apply -auto-approve -input=false tfplan

      - name: Trigger Auto Scaling Group instance refresh
        env:
          AWS_ASG_NAME: ${{ secrets.AWS_ASG_NAME }}
        run: |
          if [ -z "$AWS_ASG_NAME" ]; then
            echo "AWS_ASG_NAME not configured. Skipping..."
            exit 0
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$AWS_ASG_NAME" \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":300}'

      - name: Wait for instance refresh completion
        env:
          AWS_ASG_NAME: ${{ secrets.AWS_ASG_NAME }}
        run: |
          if [ -z "$AWS_ASG_NAME" ]; then
            echo "AWS_ASG_NAME not configured. Skipping..."
            exit 0
          fi

          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$AWS_ASG_NAME" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            echo "Current status: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              exit 1
            fi

            sleep 60
          done

          echo "Timed out waiting for instance refresh."
          exit 1

      - name: Verify ALB target health
        env:
          ALB_TARGET_GROUP_ARN: ${{ secrets.ALB_TARGET_GROUP_ARN }}
        run: |
          if [ -z "$ALB_TARGET_GROUP_ARN" ]; then
            echo "ALB_TARGET_GROUP_ARN not configured. Skipping..."
            exit 0
          fi

          aws elbv2 describe-target-health \
            --target-group-arn "$ALB_TARGET_GROUP_ARN" \
            --query "TargetHealthDescriptions[*].[Target.Id,TargetHealth.State]" \
            --output table

      - name: Smoke test application endpoints
        run: |
          curl -fsS "${{ env.APP_URL }}/health"
          curl -fsS "${{ env.APP_URL }}/readiness"