name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Configure these values in GitHub under Settings > Secrets and variables > Actions.
env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: ${{ vars.TF_VERSION || '1.14.2' }}
  TERRAFORM_DIR: terraform
  APP_DIR: application
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  lint-and-format:
    name: Lint and format checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Python lint and format checks
        run: |
          cd ${{ env.APP_DIR }}
          python -m ruff check .
          python -m ruff format --check .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Run Terraform formatting check
        run: terraform fmt -check -recursive ${{ env.TERRAFORM_DIR }}


  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install app dependencies
        run: |
          cd ${{ env.APP_DIR }}
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: |
          cd ${{ env.APP_DIR }}
          python -m pytest tests/ -v

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init and validate
        run: |
          cd ${{ env.TERRAFORM_DIR }}
          terraform init -backend=false
          terraform validate

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit safety

      - name: Run Bandit
        run: bandit -r ${{ env.APP_DIR }}/ -ll

      - name: Run pip-audit
        run: pip-audit -r ${{ env.APP_DIR }}/requirements.txt

      - name: Run Safety
        continue-on-error: true
        run: safety check -r ${{ env.APP_DIR }}/requirements.txt --full-report

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1

  cedar-validation:
    name: Cedar policy validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cedar policy files exist
        run: |
          test -f cedar/group-policy.cedar
          test -f cedar/endpoint-policy.cedar
          grep -q "permit(" cedar/group-policy.cedar
          grep -q "context.identity.group.contains" cedar/group-policy.cedar
          grep -q "permit(" cedar/endpoint-policy.cedar

          echo "Cedar policies validated successfully."

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [security, terraform-validate, cedar-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t secure-access-portal:${{ github.sha }} ${{ env.APP_DIR }}/

      - name: Save image artifact
        run: docker save secure-access-portal:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
