# Secure Verified Access demo — GitLab CI/CD Pipeline (dev environment)

stages:
  - lint
  - test
  - security
  - build
  - plan
  - deploy
  - smoke
  - integration
  - policy-validation
  - rollback

variables:
  TF_ROOT: terraform
  TF_VERSION: "1.14.2"
  AWS_DEFAULT_REGION: ap-south-1
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  ECR_REPOSITORY_NAME: secure-access-portal-dev-app
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CEDAR_POLICY_VERSION: "v1.0.0"
  ENVIRONMENT: dev
  APP_URL: https://portal-dev.cdec-engineer.store



.terraform_base: &terraform_base
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]

  before_script:
    - apk add --no-cache aws-cli curl jq
    - aws --version
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set default.region "$AWS_DEFAULT_REGION"
    - cd $TF_ROOT
    - terraform --version

# =============================================================================
# LINT STAGE
# =============================================================================

python:lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check application/
    - ruff format --check application/
  cache:
    paths:
      - .cache/pip

terraform:fmt:
  stage: lint
  <<: *terraform_base
  script:
    - terraform fmt -check -recursive .

cedar:lint:
  stage: lint
  image: alpine:3.20
  script:
    - apk add --no-cache grep
    - test -f cedar/group-policy.cedar
    - test -f cedar/endpoint-policy.cedar
    - grep -q "Policy 1" cedar/group-policy.cedar
    - grep -q "Policy 4" cedar/group-policy.cedar
    - grep -q "cdec-engineer.store" cedar/group-policy.cedar

# =============================================================================
# TEST STAGE
# =============================================================================

python:unit-test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r application/requirements.txt
    - pip install requests
    - cd application && python -m pytest tests/test_app.py -v
  cache:
    paths:
      - .cache/pip

terraform:validate:
  stage: test
  <<: *terraform_base
  script:
    - terraform init -backend=false
    - terraform validate

# =============================================================================
# SECURITY STAGE
# =============================================================================



bandit:
  stage: security
  image: python:3.12-slim
  script:
    - pip install bandit
    - bandit -r application/ -ll
  cache:
    paths:
      - .cache/pip

semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
    - semgrep --config=auto application/

pip-audit:
  stage: security
  image: python:3.12-slim
  script:
    - pip install pip-audit
    - pip-audit -r application/requirements.txt
  cache:
    paths:
      - .cache/pip

safety:
  stage: security
  image: python:3.12-slim
  script:
    - pip install safety
    - safety check -r application/requirements.txt --full-report
  allow_failure: true
  cache:
    paths:
      - .cache/pip

trivy:fs:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 .

# =============================================================================
# BUILD STAGE
# =============================================================================

docker:build:
  stage: build
  image: docker:27.4.0
  services:
    - docker:27.4.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA -t $DOCKER_IMAGE:latest application/
    - docker save $DOCKER_IMAGE:$CI_COMMIT_SHA -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

trivy:image:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [docker:build]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL || true
  dependencies:
    - docker:build

docker:push:
  stage: build
  image: docker:27.4.0
  services:
    - docker:27.4.0-dind

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"

  needs:
    - docker:build
    - trivy:image

  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag "$DOCKER_IMAGE:$CI_COMMIT_SHA" "$DOCKER_IMAGE:latest"
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHA"
    - docker push "$DOCKER_IMAGE:latest"

  only:
    - main
    - develop

.aws_auth: &aws_auth
  before_script:
    - apk add --no-cache aws-cli curl jq
    - aws --version
    - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
    - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
    - aws configure set default.region "$AWS_DEFAULT_REGION"

docker:push-ecr:
  stage: build
  image: debian:bookworm-slim

  services:
    - docker:26.1.4-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - docker:build
    - trivy:image

  before_script:
    - apt-get update
    - apt-get install -y curl unzip ca-certificates docker.io
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
    - unzip -q awscliv2.zip
    - ./aws/install
    - aws --version

  script:
    - docker load -i image.tar
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export ECR_REPOSITORY_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY_NAME}"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - docker tag "$DOCKER_IMAGE:$CI_COMMIT_SHA" "${ECR_REPOSITORY_URL}:$CI_COMMIT_SHA"
    - docker tag "$DOCKER_IMAGE:$CI_COMMIT_SHA" "${ECR_REPOSITORY_URL}:latest"
    - docker push "${ECR_REPOSITORY_URL}:$CI_COMMIT_SHA"
    - docker push "${ECR_REPOSITORY_URL}:latest"

  after_script:
    - echo "ECR_REPOSITORY_URL=${ECR_REPOSITORY_URL}" > build.env

  artifacts:
    reports:
      dotenv: build.env


